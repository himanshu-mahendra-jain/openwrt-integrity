# ------------------------------------------------------------
# Shared configuration for both scripts
# ------------------------------------------------------------

# Routers to monitor. Each router gets a baseline directory named
# after its address (e.g. root@192.168.1.1), so the order of this
# list does not matter.
ROUTERS=(
    "root@192.168.1.1"
    "root@192.168.1.2"
    "root@192.168.1.3"
)

# OpenWrt SSH private key
SSH_KEY="$HOME/.ssh/openwrt"
