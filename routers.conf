# ------------------------------------------------------------
# Shared configuration for both scripts
# ------------------------------------------------------------

# Routers to monitor, one entry per router:
#
#   "<user@address> key <private key>"     log in with an SSH key
#   "<user@address> agent [public key]"    use your running ssh-agent
#   "<user@address> password"              ask for the password
#
# Each key's passphrase is asked for once per run, even when
# several routers share it; each password is asked for once per
# router. An agent router uses any key in your agent, or only the
# one matching the public key given. Use $HOME rather than ~ in
# key paths. Every router gets
# a baseline directory named after its address (e.g.
# root@192.168.1.1), so the order of this list does not matter.
ROUTERS=(
    "root@192.168.1.1 key $HOME/.ssh/openwrt"
    "root@192.168.1.2 key $HOME/.ssh/openwrt"
    "root@192.168.1.3 key $HOME/.ssh/openwrt"
)
